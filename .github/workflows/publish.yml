name: Publish to NPM

on:
  release:
    types: [ published ]

permissions:
  contents: read
  id-token: write  # Required for the npm trusted publishing (OIDC)

jobs:
  deploy:

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Set up Node
        uses: actions/setup-node@v3
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org/

      - name: Upgrade npm
        run: npm install -g npm@^11.5.1  # The trusted publishing requires npm >= 11.5.1

      - name: Install dependencies
        run: yarn && yarn install

      - name: Build and publish
        run: yarn build && npm publish
